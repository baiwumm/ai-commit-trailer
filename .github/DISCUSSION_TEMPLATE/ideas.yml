title: "[Idea] "
body:
  - type: markdown
    attributes:
      value: |
        Use this category for ideas that are not yet concrete bug reports or registry corrections.
        For a new agent identity, open an issue with the **New agent identity** form instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What is hard today, and who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed direction
      description: Describe the outcome you want, not necessarily the implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing workarounds or other approaches.
  - type: checkboxes
    id: checks
    attributes:
      label: Before posting
      options:
        - label: I searched existing discussions and issues.
          required: true
        - label: This is about the project, not a support request for another tool.
          required: true
