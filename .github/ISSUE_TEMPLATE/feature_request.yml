name: Feature request
description: Propose a change to the CLI, checks, documentation, or workflow
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Use the [new agent identity](https://github.com/baiwumm/ai-commit-trailer/issues/new?template=new-agent.yml) form for registry additions.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - check behavior
        - fix behavior
        - registry schema or matching
        - documentation
        - GitHub workflow or repository setup
        - other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is currently hard or impossible, and who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you want, including edge cases.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include workarounds with the current behavior, if any.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: This is one request, not several bundled together.
          required: true
        - label: I searched existing issues and the documentation.
          required: true
